# Netlify builds this as a Next.js site. Its Next.js adapter (OpenNext, @netlify/plugin-nextjs) is
# added automatically on every build, so it is not pinned here. Setup notes: docs/deploy-netlify.md
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # The site's database (Supabase project "kleros-events"). Both values are public by design: they
  # ship in every page the browser loads, and the database rules protect the data. Keeping them here
  # means a new Netlify site needs no settings, and values set in the Netlify UI cannot point the
  # site at another database by mistake (netlify.toml wins over the UI). Secret keys never go here.
  NEXT_PUBLIC_SUPABASE_URL = "https://pdrvfjmhmauovehanyan.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY = "sb_publishable_aojO60b1fNRj6AOG6lPSRw_pzbnSnlI"
  # Cloudflare Turnstile bot check on sign-in and guest questions (widget "Kleros Events sign-in" in
  # Wei Wei's Cloudflare account, hostnames events.kleros.io and kleros-events.vercel.app). The site key is
  # public; its secret is pasted only into Supabase > Authentication > Attack Protection.
  NEXT_PUBLIC_TURNSTILE_SITE_KEY = "0x4AAAAAAGIy4qsDlR6kZN1U"
